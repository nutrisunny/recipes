<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="6 題看你的三餐哪裡可以再補一點，測完送外食族餐盤小卡。">
<meta property="og:title" content="你的餐盤及格嗎？｜Sunny 營養師 6 題小測驗">

<style>body{margin:0}img{max-width:100%}</style>
<title>你的餐盤及格嗎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：手機單欄、一頁一題、大字大按鈕（客群 50+ 會放大字體）；米黃底沿用官方角色總表底色 */
:root{
  --bg:#FBF5DF;        /* 米黃，官方角色底 */
  --paper:#FFFDF6;
  --ink:#4A2E1F;       /* 深咖啡，重點字 */
  --ink-soft:#7A5C48;
  --teal:#0E8C8D;      /* 品牌青綠加深，白字可讀 */
  --teal-bright:#13BCBD;
  --sun:#F6C945;
  --coral:#D9603F;
  --line:#E7D9AE;
  --display:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6;font-weight:500}
.wrap{max-width:520px;margin:0 auto;padding-inline:18px;padding-block:14px 40px;display:flex;flex-direction:column;gap:18px}
.proto{background:var(--paper);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink-soft);line-height:1.5}
.proto b{color:var(--ink)}
.proto .jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.proto .jump a{font-size:14px;color:var(--teal);background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;text-decoration:none}
h1,h2{font-family:var(--display);font-weight:900;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:36px}
h2{font-size:26px}
p{margin:0}
.brand{font-size:15px;letter-spacing:.08em;color:var(--teal);font-weight:700}

/* 開場 */
.hero{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.hero .txt{display:flex;flex-direction:column;gap:12px;min-width:0;padding-bottom:18px}
.hero img{height:260px;width:auto}
.hl{background:linear-gradient(transparent 58%,var(--sun) 58%)}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;font-size:19px;position:relative}
.facts{display:flex;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--ink-soft)}
.facts span{background:var(--paper);border-radius:99px;padding:3px 12px;border:1px solid var(--line)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;border-radius:16px;border:0;font:inherit;font-size:22px;font-weight:900;cursor:pointer;text-decoration:none;font-family:var(--display)}
.btn-main{background:var(--teal);color:#fff;box-shadow:0 4px 0 #0A6667}
.btn-main:active{transform:translateY(3px);box-shadow:0 1px 0 #0A6667}
.btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);font-size:19px;min-height:54px}
.btn:focus-visible,.opt:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* 題目 */
.top{display:flex;align-items:center;gap:12px}
.top img{height:84px;width:auto;flex:none}
.prog{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.prog .lbl{font-size:16px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal-bright);border-radius:99px;transition:width .3s}
.q{font-size:28px}
.hint{font-size:17px;color:var(--ink-soft)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:72px;padding:12px 16px;background:var(--paper);border:2px solid var(--line);border-radius:16px;font:inherit;font-size:21px;color:var(--ink);cursor:pointer}
.opt .em{font-size:30px;flex:none;width:40px;text-align:center}
.opt.picked{border-color:var(--teal);background:#E3F6F4}
.back{background:none;border:0;font:inherit;font-size:17px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;align-self:flex-start;padding:4px 0}

/* 結果 */
.res-head{background:var(--paper);border-radius:22px;padding:20px 18px 0;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end;border:2px solid var(--ink)}
.res-head .txt{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;min-width:0}
.res-head img{height:190px;width:auto}
.tag{align-self:flex-start;background:var(--sun);color:var(--ink);font-weight:900;font-size:15px;border-radius:99px;padding:2px 12px}
.res-head h2{font-size:32px}
.plate{background:var(--paper);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.plate h3,.tips h3{margin:0;font-size:21px;font-family:var(--display);font-weight:900}
.row{display:grid;grid-template-columns:4.2em 1fr 4.2em;gap:10px;align-items:center;font-size:18px}
.row .bar{height:18px}
.row .st{font-size:16px;font-weight:700;text-align:right}
.st.good{color:var(--teal)} .st.ok{color:#A07B12} .st.low{color:var(--coral)}
.bar i.good{background:var(--teal-bright)} .bar i.ok{background:var(--sun)} .bar i.low{background:var(--coral)}
.tips{display:flex;flex-direction:column;gap:10px}
.tips ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.tips li{counter-increment:t;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;background:var(--paper);border-radius:14px;padding:12px 14px;font-size:19px}
.tips li::before{content:counter(t);width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px}
.cta{background:var(--teal);color:#fff;border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.cta p{font-size:20px}
.mini{border:0;background:var(--sun);color:var(--ink);font:inherit;font-weight:700;font-size:14px;border-radius:8px;padding:2px 10px;cursor:pointer;margin-left:4px}
.kw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px 10px 16px}
.kw b{font-size:28px;font-family:var(--display);font-weight:900;letter-spacing:.05em}
.kw button{border:0;background:var(--sun);color:var(--ink);font:inherit;font-weight:900;font-size:17px;border-radius:10px;padding:8px 14px;cursor:pointer;flex:none}
.btn-line{background:#06C755;color:#fff;box-shadow:0 4px 0 #04913E}
.small{font-size:15px;color:var(--ink-soft);text-align:center}
.cta .small{color:#D8F3F2}
.vidbox{display:flex;flex-direction:column;gap:8px}
.vidbox h3{margin:0;font-size:21px;font-family:var(--display);font-weight:900}
.vtitle{font-size:18px;color:var(--ink-soft)}
.vframe{position:relative;display:block;width:min(100%,320px);aspect-ratio:9/16;margin:4px auto 0;border:0;padding:0;border-radius:18px;overflow:hidden;background:var(--ink);cursor:pointer}
.vframe img,.vframe iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.vframe .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.play{flex:none;width:56px;height:56px;border-radius:50%;background:#E0412E;display:grid;place-items:center}
.play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.also{font-size:17px;background:#FFF3C9;border-radius:10px;padding:6px 12px;align-self:flex-start}
.foot{font-size:14px;color:var(--ink-soft);text-align:center;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:380px){h1{font-size:31px}.hero img{height:220px}.res-head img{height:150px}.res-head h2{font-size:27px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 star:{name:'餐盤模範生',desc:'蔬果、蛋白質、全穀都有顧到，繼續保持！',kw:'模範生',alt:'Q版安媽開心跳起來',
  tips:['把你的吃法分享給家人朋友','外食時一樣先看有沒有青菜跟蛋白質','偶爾換換不同顏色的蔬果，吃得更豐富']}
};
let i=0,ans=[];
// GoatCounter 事件（跟食譜網站同一個帳號），沒載入就不做事
function gc(path){try{window.goatcounter&&goatcounter.count&&goatcounter.count({path:'測驗/'+path,title:path,event:true})}catch(e){}}
const $=id=>document.getElementById(id);
function show(id){['s-intro','s-q','s-res'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0)}
function renderQ(){
  const q=Q[i];
  $('plbl').textContent=`第 ${i+1} 題／共 ${Q.length} 題`;
  $('pbar').style.width=(i/Q.length*100)+'%';
  $('qt').textContent=q.t;$('qh').textContent=q.h;
  $('opts').innerHTML='';
  q.o.forEach(([em,txt,pt],j)=>{
    const b=document.createElement('button');b.className='opt'+(ans[i]===j?' picked':'');b.id='opt'+j;
    b.innerHTML=`<span class="em" aria-hidden="true">${em}</span><span>${txt}</span>`;
    b.onclick=()=>{b.classList.add('picked');ans[i]=j;setTimeout(()=>{i++;i<Q.length?renderQ():result()},220)};
    $('opts').appendChild(b);
  });
  $('back').hidden=i===0;
}
function scores(){
  const s={veg:0,pro:0,grain:0,sugar:0};
  Q.forEach((q,k)=>{if(ans[k]!=null)s[q.d]+=q.o[ans[k]][2]});
  return s;
}
// 同分時：比「選到最差答案」的比例，再同分就主型取第一個、其餘列為「也可以加強」
function pick(s){
  const pct=DIMS.map(d=>{
    const qs=Q.map((q,k)=>[q,k]).filter(([q])=>q.d===d.k);
    const worst=qs.filter(([q,k])=>ans[k]!=null&&q.o[ans[k]][2]===0).length/qs.length;
    return {k:d.k,p:s[d.k]/d.max,w:worst};
  });
  if(pct.every(x=>x.p>=0.75))return {t:'star',also:[]};
  const min=Math.min(...pct.map(x=>x.p));
  const tied=pct.filter(x=>x.p===min).sort((a,b)=>b.w-a.w);
  const top=tied.filter(x=>x.w===tied[0].w);
  return {t:top[0].k,also:top.slice(1).map(x=>x.k)};
}
function result(forced){
  let s;
  if(forced){s=forced==='star'?{veg:4,pro:4,grain:2,sugar:2}:{veg:3,pro:3,grain:2,sugar:2,[forced]:0}}
  else s=scores();
  const pk=forced?{t:forced,also:[]}:pick(s),t=pk.t,r=R[t];
  const names={veg:'蔬果',pro:'蛋白質',grain:'全穀',sugar:'少糖'};
  $('ralso').hidden=!pk.also.length;
  $('ralso').textContent=pk.also.length?'另外「'+pk.also.map(k=>names[k]).join('」「')+'」也可以再加強':'';
  $('linego').href='https://line.me/R/oaMessage/@i333/?'+encodeURIComponent(r.kw);
  $('rname').textContent=r.name;$('rdesc').textContent=r.desc;
  $('rimg').src=IMG[t];$('rimg').alt=r.alt;$('kw').textContent=r.kw;
  $('rows').innerHTML=DIMS.map(d=>{
    const p=s[d.k]/d.max,c=p>=0.75?'good':p>=0.5?'ok':'low',l=p>=0.75?'很夠':p>=0.5?'還可以':'要加油';
    return `<div class="row"><span>${d.n}</span><div class="bar"><i class="${c}" style="width:${Math.max(p*100,6)}%"></i></div><span class="st ${c}">${l}</span></div>`;
  }).join('');
  $('tips').innerHTML=r.tips.map(x=>`<li><span>${x}</span></li>`).join('');
  if(!forced)gc('完成/'+r.kw);
  show('s-res');
}
async function copy(text,btn,done){
  try{await navigator.clipboard.writeText(text);const o=btn.textContent;btn.textContent=done;setTimeout(()=>btn.textContent=o,1600)}
  catch(e){btn.textContent='請長按上面文字複製'}
}
$('linego').addEventListener('click',()=>gc('領小卡/'+$('kw').textContent));
$('start').onclick=()=>{gc('開始');i=0;ans=[];renderQ();show('s-q')};
$('back').onclick=()=>{if(i>0){i--;renderQ()}};
$('again').onclick=()=>{i=0;ans=[];show('s-intro')};
$('copykw').onclick=e=>copy($('kw').textContent,e.currentTarget,'已複製');
$('copylink').onclick=e=>{gc('複製連結');copy(location.href.split('#')[0],e.currentTarget,'已複製，貼給家人吧')};
function route(){const h=location.hash.slice(1);if(R[h])result(h)}
window.addEventListener('hashchange',route);route();
</script>

<script data-goatcounter="https://nutrisunny.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
